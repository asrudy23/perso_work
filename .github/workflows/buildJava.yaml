name : Java CI with Maven - Test and Package
#fix sonar token problem
on:
    pull_request:
        branches: main
jobs:
    build :
      name: Build with maven
      runs-on: ubuntu-latest
      steps : 
        - name : Checkout repository
          uses: actions/checkout@v4
        - name : Setup JDK
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'corretto'
        - name: Cache Maven packages
          uses: actions/cache@v4
          with:
            path: ~/.m2
            key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
            restore-keys: ${{ runner.os }}-m2
        - name: Cache SonarQube packages
          uses: actions/cache@v4
          with:
            path: ~/.sonar/cache
            key: ${{ runner.os }}-sonar
            restore-keys: ${{ runner.os }}-sonar
        - name: Build package with maven
          env:
            SONAR_TOKEN : ${{secrets.SONAR_TOKEN}}  
          run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=$(echo ${{ github.repository }} | sed 's-/-_-') -Dsonar.organization=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')

          
          
            
            

            



